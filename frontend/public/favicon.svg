<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark grey to deep black diagonal gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <!-- Background with slight border radius -->
  <rect width="64" height="64" rx="10" fill="url(#bgGradient)" />
  
  <!-- Rounded-Rectangular Frames with White Outline -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(6, 21)">
    <!-- Left Lens Frame -->
    <rect x="2" y="1" width="20" height="15" rx="5" />
    
    <!-- Right Lens Frame -->
    <rect x="30" y="1" width="20" height="15" rx="5" />
    
    <!-- Arched Bridge -->
    <path d="M 22 5 C 24 3 28 3 30 5" />
    
    <!-- Outer Side Hinges -->
    <line x1="-1" y1="4" x2="2" y2="4" />
    <line x1="50" y1="4" x2="53" y2="4" />
  </g>
</svg>